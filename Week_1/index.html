<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>My project</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        min-height: 100vh;
        background-color: #0f1318;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #unity-container {
        position: relative !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        margin: auto !important;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.85);
        border: 2px solid #28313e;
        border-radius: 16px;
        overflow: hidden;
        background: #171d26;
      }
      #unity-canvas {
        width: 450px !important;
        height: 800px !important;
        background: #171d26;
        display: block;
      }
      @media (max-height: 920px) {
        #unity-canvas {
          height: 85vh !important;
          width: calc(85vh * 9 / 16) !important;
        }
      }
      @media (max-width: 500px) {
        html, body {
          height: 100%;
        }
        #unity-container {
          width: 100vw !important;
          height: 100vh !important;
          border: none !important;
          border-radius: 0 !important;
          box-shadow: none !important;
        }
        #unity-canvas {
          width: 100% !important;
          height: 100% !important;
        }
        #unity-footer {
          display: none !important;
        }
      }
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: none;
        text-align: center;
      }
      #unity-logo {
        width: 100px;
        height: 100px;
        margin: 0 auto 20px auto;
        background: url('TemplateData/unity-logo-dark.png') no-repeat center;
        background-size: contain;
      }
      #unity-progress-bar-empty {
        width: 200px;
        height: 12px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        overflow: hidden;
      }
      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: #409eff;
        border-radius: 6px;
        transition: width 0.2s ease;
      }
      #unity-warning {
        position: absolute;
        left: 50%;
        top: 5%;
        transform: translate(-50%, 0);
        background: #e6a23c;
        padding: 10px;
        display: none;
        border-radius: 6px;
        color: #fff;
        font-size: 13px;
        z-index: 100;
      }
      #unity-footer {
        width: 100%;
        background: #13171e;
        padding: 10px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #a0aec0;
        font-size: 14px;
        font-weight: 500;
        border-top: 1px solid #232b36;
      }
      #unity-build-title {
        font-weight: 600;
        color: #e2e8f0;
      }
      #unity-fullscreen-button {
        cursor: pointer;
        background: #2b3544;
        color: #fff;
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 12px;
        user-select: none;
      }
      #unity-fullscreen-button:hover {
        background: #3b4759;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="540" height="960" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-build-title">My project</div>
        <div id="unity-fullscreen-button">Toàn màn hình</div>
      </div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: #f56c6c; padding: 10px; color: white;';
        else {
          if (type == 'warning') div.style = 'background: #e6a23c; padding: 10px; color: white;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Week_1.loader.js";
      var config = {
        dataUrl: buildUrl + "/Week_1.data.br",
        frameworkUrl: buildUrl + "/Week_1.framework.js.br",
        codeUrl: buildUrl + "/Week_1.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "My project",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
